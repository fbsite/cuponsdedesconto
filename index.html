<!doctype html>
<html lang="pt-BR">
<head>
  <!-- Meta tags essenciais -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- SEO Otimizado -->
  <title>Fábio Oliveira — Confira todos os meus negócios</title>
  <meta name="description" content="Conheça todos os sites e projetos de Fábio Oliveira, criador do Santo Salgado e produtos milionários. Acesse os links para saber mais." />
  <meta name="author" content="Fábio Oliveira">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Fábio Oliveira — Confira todos os meus negócios">
  <meta property="og:description" content="Conheça todos os sites e projetos de Fábio Oliveira, criador do Santo Salgado e produtos milionários.">
  <meta property="og:image" content="https://cdn.pixabay.com/photo/2017/06/13/13/11/man-2399039_640.jpg">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="Fábio Oliveira — Confira todos os meus negócios">
  <meta property="twitter:description" content="Conheça todos os sites e projetos de Fábio Oliveira, criador do Santo Salgado e produtos milionários.">
  <meta property="twitter:image" content="https://cdn.pixabay.com/photo/2017/06/13/13/11/man-2399039_640.jpg">

  <!-- Fontes -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --accent-green: #10b981;
      --accent-blue: #3b82f6; 
      --bg: #f4f7f6; 
      --text: #111827; 
      --muted: #6b7280;
      --radius: 20px;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 16px;
    }
    
    header {
      text-align: center;
      margin-bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 500px;
    }
    
    header img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #fff; /* Borda branca para destacar a foto do brilho */
      /* Efeito de neon subtil na foto de perfil */
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5), 0 0 25px rgba(16, 185, 129, 0.3);
      transition: box-shadow 0.3s ease;
    }
    
    header h1 {
      font-weight: 700;
      font-size: 1.5rem;
      margin-top: 10px;
    }
    
    header p {
      color: var(--muted);
      font-size: 1rem;
    }
    
    main {
      width: 85%;
      max-width: 1100px; 
    }
    
    .link-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 25px; /* Aumentado o espaço para o brilho respirar */
      width: 100%;
    }
    
    .link-card {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      height: 150px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      text-decoration: none;
      color: #fff;
      background-size: cover;
      background-position: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      animation: fadeInUp 0.8s ease-out forwards;
    }
    
    .link-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent 60%);
      transition: background 0.3s ease;
    }

    .link-card span {
      position: relative;
      width: 100%;
      text-align: center;
      padding: 16px;
      font-weight: 600;
      font-size: 1.1rem;
      transform: translateY(10px);
      transition: transform 0.3s ease, color 0.3s ease;
    }
    
    .link-card:hover {
      transform: scale(1.04) translateY(-4px); /* Adiciona um leve movimento para cima */
      /* Efeito de neon no hover dos cards */
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.6), 0 4px 20px rgba(0,0,0,0.15);
    }

    .link-card:hover span {
      transform: translateY(0);
      color: var(--accent-green); /* Muda a cor do texto para o verde neon */
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    /* Media query para telas de tablet */
    @media (min-width: 640px) {
      .link-list {
        grid-template-columns: repeat(2, 1fr);
      }
      .link-card {
        height: 180px;
      }
    }
    
    /* Media query para telas de desktop */
    @media (min-width: 1024px) {
      .link-list {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="https://cdn.pixabay.com/photo/2017/06/13/13/11/man-2399039_640.jpg" alt="Foto de perfil de Fábio Oliveira">
    <h1>Fábio Oliveira</h1>
    <p>Empreendedor digital • Criador de produtos milionários</p>
  </header>
  
  <main>
    <nav class="link-list">
      <a href="#link1" class="link-card" style="background-image:url('https://cdn.pixabay.com/photo/2015/05/28/14/53/ux-788002_1280.jpg')"><span>Site Oficial</span></a>
      <a href="#link2" class="link-card" style="background-image:url('https://cdn.pixabay.com/photo/2017/02/15/11/11/brazilian-cheese-bread-2068361_1280.jpg')"><span>Santo Salgado</span></a>
      <a href="#link3" class="link-card" style="background-image:url('https://cdn.pixabay.com/photo/2021/08/04/13/06/software-developer-6521720_1280.jpg')"><span>Prompt Rico</span></a>
      <a href="#link4" class="link-card" style="background-image:url('https://cdn.pixabay.com/photo/2016/11/22/19/21/adult-1850178_1280.jpg')"><span>Canal YouTube</span></a>
      <a href="#link5" class="link-card" style="background-image:url('https://cdn.pixabay.com/photo/2017/08/07/14/02/man-2604149_1280.jpg')"><span>Instagram Fitness</span></a>
      <a href="#link6" class="link-card" style="background-image:url('https://cdn.pixabay.com/photo/2018/06/22/20/46/analytics-3491942_1280.jpg')"><span>Marketing Digital</span></a>
      <a href="#link7" class="link-card" style="background-image:url('https://cdn.pixabay.com/photo/2016/03/09/09/22/workplace-1245776_1280.jpg')"><span>Projetos</span></a>
      <a href="#link8" class="link-card" style="background-image:url('https://cdn.pixabay.com/photo/2022/05/27/04/23/whatsapp-7224209_1280.png')"><span>Contato WhatsApp</span></a>
      <a href="#link9" class="link-card" style="background-image:url('https://cdn.pixabay.com/photo/2017/07/31/22/59/people-2561937_1280.jpg')"><span>Portfólio</span></a>
      <a href="#link10" class="link-card" style="background-image:url('https://cdn.pixabay.com/photo/2018/05/08/08/44/artificial-intelligence-3382507_1280.jpg')"><span>IA & Automação</span></a>
    </nav>
  </main>
  
  <footer>
    © <span id="year"></span> Fábio Oliveira | Todos os direitos reservados
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
